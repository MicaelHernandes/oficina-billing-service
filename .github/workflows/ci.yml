name: CI

on:
  pull_request:
  push:
    branches: [homolog, master]

permissions:
  contents: read

jobs:
  tests:
    name: Pint + PHPStan + Pest (cobertura >= 80%)
    runs-on: ubuntu-latest

    services:
      # NoSQL do Billing; a suíte recria a tabela a cada teste.
      dynamodb:
        image: amazon/dynamodb-local:2.5.4
        ports:
          - 8000:8000

    env:
      DYNAMODB_ENDPOINT: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Configura PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: "8.4"
          extensions: bcmath, intl, mbstring, zip, pcntl
          coverage: pcov
          # Sem isto o pcov instrumenta só src/ e ignora app/.
          ini-values: pcov.directory=.
          tools: composer:v2

      - name: Cache Composer
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: vendor
          key: composer-${{ hashFiles('composer.lock') }}
          restore-keys: composer-

      - name: Instala dependências
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepara .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Pint (code style)
        run: ./vendor/bin/pint --test

      - name: PHPStan
        run: ./vendor/bin/phpstan analyse --no-progress --memory-limit=1G

      - name: Testes (Pest) com cobertura mínima de 80%
        run: php artisan test --coverage --min=80 --coverage-clover=coverage.xml

      - name: Publica o relatório de cobertura
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: ignore

  infra:
    name: Terraform (fmt + validate)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2

      - name: fmt
        run: terraform fmt -check -recursive

      - name: validate
        run: |
          terraform init -backend=false -input=false
          terraform validate

  build:
    name: Docker build (sem push)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build da imagem (validação)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
