apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# O namespace "oficina" é compartilhado e criado pela pipeline (e pelo OS Service).
namespace: oficina

resources:
  - ../../base
  - ingress.yaml

patches:
  - path: serviceaccount-irsa.yaml

# A pipeline substitui a imagem: kustomize edit set image oficina-billing=<ECR>:<sha>
images:
  - name: oficina-billing
    newName: oficina-billing
    newTag: latest
